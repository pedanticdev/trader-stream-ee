# JVM Configuration Notes:
# ==========================
# The JAVA_OPTS environment variables below OVERRIDE the ENV JAVA_OPTS defined in
# Dockerfile.scale. These are the authoritative flags used for cluster deployments.
# If you update flags here, ensure consistency across all instances (c4-1, c4-2, c4-3).

services:
  traefik-c4:
    image: traefik:v3.6.12
    container_name: trader-traefik-c4
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.constraints=Label(`cluster`, `c4`)"
      - "--entrypoints.web.address=:80"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.addServicesLabels=true"
    ports:
      - "8080:80"
      - "8084:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - trader-network
      - monitoring
    labels:
      - "jvm_type=azul-c4"
    restart: unless-stopped

  trader-stream-c4-1:
    image: trader-stream-ee:c4
    build:
      context: .
      dockerfile: Dockerfile.scale
      args:
        PAYARA_VERSION: ${PAYARA_VERSION:-7.2026.3}
    container_name: trader-stream-c4-1
    hostname: trader-stream-c4-1
    ports:
      - "8081:8080"
      - "9010:9010"  # JMX Exporter
    expose:
      - "5701"
    shm_size: 512m
    environment:
      - TRADER_INGESTION_MODE=${TRADER_INGESTION_MODE:-AERON}
      - PAYARA_INSTANCE_NAME=c4-instance-1
      - HAZELCAST_MEMBER_NAME=trader-stream-c4-1
      - ENABLE_PUBLISHER=true
      - JVM_TYPE=azul-c4
      - JAVA_OPTS=-Xms4g -Xmx4g
        -Xlog:gc*:file=/opt/payara/gc-logs/gc.log:time,uptime,level,tags:filecount=20,filesize=10M
        -XX:+PrintCompilation
        -XX:+TraceDeoptimization
        -XX:+LogVMOutput
        -XX:-DisplayVMOutput
        -XX:LogFile=/opt/payara/gc-logs/hotspot.log
        --add-opens java.base/jdk.internal.misc=ALL-UNNAMED
        --add-opens java.base/sun.nio.ch=ALL-UNNAMED
        --add-opens java.base/java.nio=ALL-UNNAMED
        -XX:+AlwaysPreTouch
        -XX:+UseTransparentHugePages
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -javaagent:/opt/payara/jmx_prometheus_javaagent.jar=9010:/opt/payara/jmx-exporter-config.yml
        -Djava.net.preferIPv4Stack=true
    volumes:
      - ./monitoring/jmx-exporter/jmx_prometheus_javaagent-1.0.1.jar:/opt/payara/jmx_prometheus_javaagent.jar:ro
      - ./monitoring/jmx-exporter/jmx-exporter-config.yml:/opt/payara/jmx-exporter-config.yml:ro
      - ./monitoring/logs/c4-1:/opt/payara/logs
      - ./monitoring/gc-logs/c4-1:/opt/payara/gc-logs
      - ./monitoring/recordings/c4-1:/opt/payara/recordings
      - ./workshop/jfr-settings:/opt/payara/jfr-settings:ro
    labels:
      - "traefik.enable=true"
      - "cluster=c4"
      - "traefik.http.routers.trader-stream-c4.rule=PathPrefix(`/`)"
      - "traefik.http.services.trader-stream-c4.loadbalancer.server.port=8080"
      - "jvm_type=azul-c4"
      - "instance=c4-1"
    networks:
      - trader-network
      - monitoring
    restart: unless-stopped

  trader-stream-c4-2:
