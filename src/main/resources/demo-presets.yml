# Demo Preset Configuration for TradeStreamEE
# Each preset chains memory pressure scenarios to demonstrate runtime behaviour
# under realistic trading workloads.

presets:
  - id: MARKET_OPEN_SPIKE
    name: "Market Open Spike"
    description: "Simulates NYSE open with 5x allocation surge. Concurrent collectors absorb the burst; STW collectors stutter."
    durationSeconds: 30
    expectedImpact: "High"
    steps:
      - mode: STEADY_LOAD
        durationSeconds: 5
        description: "Baseline warmup"
      - mode: INTRADAY_POSITION_GROWTH
        durationSeconds: 15
        description: "5x burst allocation - simulates market open surge"
      - mode: STEADY_LOAD
        durationSeconds: 10
        description: "Return to baseline"

  - id: EXECUTIVE_30_SEC
    name: "Executive 30-Sec"
    description: "Quick demo for executive meetings. Shows concurrent-vs-STW runtime difference in 30 seconds."
    durationSeconds: 30
    expectedImpact: "High"
    steps:
      - mode: EARNINGS_SPIKE
        durationSeconds: 30
        description: "Post-earnings surge - tests how the runtime absorbs sudden directional flow"

  - id: TRADING_DAY_STRESS
    name: "Trading Day Stress"
    description: "Full trading day simulation with mixed scenarios. Tests how the runtime sustains long-running mixed pressure."
    durationSeconds: 180
    expectedImpact: "Very High"
    steps:
      - mode: STEADY_LOAD
        durationSeconds: 60
        description: "Morning steady trading"
      - mode: EARNINGS_SPIKE
        durationSeconds: 60
        description: "Lunch volume spike - tests how the runtime handles directional flow"
      - mode: MULTI_VENUE_QUOTE_CHURN
        durationSeconds: 60
        description: "Afternoon quote churn stress"

  - id: QUOTE_CHURN_HELL
    name: "Quote Churn Hell"
    description: "Worst-case scenario for region-based STW collectors: pure short-lived object churn. Concurrent compacting collectors absorb it."
    durationSeconds: 120
    expectedImpact: "High"
    steps:
      - mode: MULTI_VENUE_QUOTE_CHURN
        durationSeconds: 120
        description: "Small objects with random lifetimes - tests compaction"

  - id: FULL_DAY
    name: "Full Day Simulation"
    description: "Complete 6.5 hour trading session condensed to 5 minutes. Comprehensive picture."
    durationSeconds: 300
    expectedImpact: "Very High"
    steps:
      - mode: STEADY_LOAD
        durationSeconds: 60
        description: "Pre-market warmup"
      - mode: INTRADAY_POSITION_GROWTH
        durationSeconds: 60
        description: "Market open - growing position book"
      - mode: EARNINGS_SPIKE
        durationSeconds: 60
        description: "Mid-morning earnings spike"
      - mode: STEADY_LOAD
        durationSeconds: 30
        description: "Mid-day lull"
      - mode: LONG_HORIZON_POSITION_BOOK
        durationSeconds: 60
        description: "Afternoon cross-gen reference stress on the runtime"
      - mode: MULTI_VENUE_QUOTE_CHURN
        durationSeconds: 30
        description: "Close: multi-venue quote churn"
